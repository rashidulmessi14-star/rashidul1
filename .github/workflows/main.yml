# 🚀 Create a Free Windows VPS Using GitHub Actions + Tailscale

This guide will show you how to create a **Free Windows VPS (RDP)** using **GitHub Actions** and securely access it with **Tailscale**.

---

# 📋 Requirements

Before getting started, make sure you have:

* A GitHub Account
* A GitHub Repository
* A Tailscale Account
* A Tailscale Auth Key
* Windows Remote Desktop Connection (RDP)

---

# Step 1 — Generate a Tailscale Auth Key

1. Log in to your Tailscale account.
2. Go to the **Keys** section.
3. Click **Generate Auth Key**.
4. Copy the generated key.

You will use this key inside GitHub Secrets.

---

# Step 2 — Add the GitHub Secret

Open your GitHub Repository.

Navigate to:

```text
Settings
→ Secrets and Variables
→ Actions
→ New Repository Secret
```

Create a new secret with the following values:

**Secret Name**

```text
TAILSCALE_AUTH_KEY
```

**Secret Value**

```text
Paste Your Tailscale Auth Key Here
```

Click **Add Secret**.

---

# Step 3 — Create the Workflow

Inside your repository create the following folders:

```text
.github/
└── workflows/
```

Create a new file named:

```text
rdp.yml
```

Copy and paste the following workflow into the file.

```yaml
name: RDP

on:
  workflow_dispatch:

jobs:
  rdp-job:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = -join ((33..126) | Get-Random -Count 16 | % {[char]$_})
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $out = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process msiexec.exe -ArgumentList "/i $out /quiet /norestart" -Wait

      - name: Connect Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-${{ github.run_id }}
          $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TS_IP=$ip" >> $env:GITHUB_ENV

      - name: Show Connection Info
        run: |
          Write-Host "`n============================"
          Write-Host "✅ RDP Connected Successfully"
          Write-Host "IP Address (Tailscale): $env:TS_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "============================`n"

      - name: Keep Alive
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Running..."
            Start-Sleep -Seconds 300
          }
```

---

# Step 4 — Run the Workflow

1. Open your GitHub Repository.
2. Click **Actions**.
3. Select **RDP**.
4. Click **Run Workflow**.
5. Wait 2–5 minutes.

---

# Step 5 — Get Your Login Details

After the workflow finishes, open the logs.

You will see:

* ✅ Tailscale IP Address
* 👤 Username
* 🔑 Password

Save them safely.

---

# Step 6 — Connect to the VPS

Open **Remote Desktop Connection**.

Enter the Tailscale IP.

Click **Connect**.

Login using:

* Username: **RDP**
* Password: **Generated Password**

